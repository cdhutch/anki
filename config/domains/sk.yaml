# Slovak domain configuration
# Supports Slovak lexeme and alphabet notes

domain: sk
display_name: Slovak

note_types:
  sk_lexeme:
    fields:
      - NoteID
      - Lemma
      - PartOfSpeech
      - Gender
      - EN_Gloss
      - CS_Gloss
      - DE_Gloss
      - FR_Gloss
      - UA_Gloss
      - RU_Gloss
      - Govt_Case
      - IrregularForms
      - Mnemonic_EN
      - ConfusableSet
      - CompareScenario
      - CompareA
      - CompareB
      - CompareC
      - CompareD
      - SK_Example
      - EN_Example
      - Tags_Ch
      - Source_URL
      - Source_Note
      - Verification Notes

    computed_fields: []

    always_present_fields:
      - Gender
      - Verification Notes

    sparse_fields:
      - Govt_Case
      - IrregularForms
      - ConfusableSet
      - CompareA
      - CompareB
      - CompareC
      - CompareD

    compare_card_enabled: true

  sk_alphabet:
    fields:
      - NoteID
      - Letter
      - IPA_Symbol
      - Type
      - Description
      - Example_Word
      - EN_Gloss
      - Language_Analogs
      - Tags_Ch
      - Source_URL
      - Source_Note
      - Verification Notes

    computed_fields: []

    always_present_fields:
      - Letter
      - IPA_Symbol
      - Type
      - Verification Notes

    sparse_fields:
      - Example_Word
      - EN_Gloss
      - Description

    compare_card_enabled: false

# Suspension policy
suspension_policy:
  tag_suspend:
    - status:draft
    - stress:unverified
  tag_no_suspend: []
  flag_suspend:
    - 1  # Red flag
  compare_card_suspend: true

# Text normalization
apostrophe_normalization: u02bc

# Styling
css_theme: gruvbox
