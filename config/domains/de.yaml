# German domain configuration
# Minimal lexeme schema without aspect complexity

domain: de
display_name: German

note_types:
  de_lexeme:
    fields:
      - NoteID
      - Lemma
      - PartOfSpeech
      - Gender
      - EN_Gloss
      - CS_Gloss
      - FR_Gloss
      - SK_Gloss
      - UA_Gloss
      - RU_Gloss
      - Govt_Case
      - IrregularForms
      - Mnemonic_EN
      - ConfusableSet
      - CompareScenario
      - CompareA
      - CompareB
      - CompareC
      - CompareD
      - DE_Example
      - EN_Example
      - Tags_Ch
      - Source_URL
      - Source_Note
      - Verification Notes

    computed_fields: []

    always_present_fields:
      - Gender
      - Verification Notes

    sparse_fields:
      - Govt_Case
      - IrregularForms
      - ConfusableSet
      - CompareA
      - CompareB
      - CompareC
      - CompareD

    compare_card_enabled: true

# Suspension policy
suspension_policy:
  tag_suspend:
    - status:draft
    - stress:unverified
  tag_no_suspend: []
  flag_suspend:
    - 1  # Red flag
  compare_card_suspend: true

# Text normalization
apostrophe_normalization: u02bc

# Styling
css_theme: gruvbox
