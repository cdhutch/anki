      compare_a: підходити
      compare_b: доходити
      compare_c: ''
      compare_d: ''
      homograph_sense_a: ''
      homograph_sense_b: ''
    - note_id: ua-lexeme-0119
      lemma: дохо́дити
      status: sourced
      chapter: 2.9
      comment: 'до + ходити: reach/arrive at (destination reached)'
