# Confusable Word Cluster Registry
#
# SCHEMA STRUCTURE
# ================
#
# This registry organizes confusable Ukrainian words into semantic clusters for Compare cards.
# All clusters render through a single mechanism at Anki-sync time: for a given note_id,
# get_cluster_compare_members_json() (tools/anki/sync/ua_lexeme_import.py) looks up the
# cluster, reads compare_scenario for that member, and JSON-encodes {scenario, members:
# [lemma, ...]} into the note's CompareMembers field. The member list is not size-limited
# to two/three/four -- a cluster can have as many members as make sense (see
# power-strength-synonyms, 6 members).
#
# Two semantic cluster shapes are still distinguished for authoring/description purposes,
# but both use the exact same fields and the exact same JSON rendering path:
#
# Shape 1 (Homographs): Same word, different meanings (stress-shift or polysemy)
#   Example: лавка (bench) vs лавка (market stall) — two note_ids for same lemma
#
# Shape 2 (Confusables): Different words, similar meanings or usage patterns
#   Example: значно (formal) vs набагато (everyday) — two different words, same cluster
#
# REMOVED FIELDS (2026-08-27): compare_a/b/c/d and homograph_sense_a/b were per-member
# fields from an earlier (pre-JSON) Compare card design that rendered up to four fixed
# CompareA-D note fields plus Homograph_SenseA/B. The 2026-07/08 migration removed
# CompareA/B/C/D, CompareScenario, and Homograph_SenseA/B from the UA_Lexeme note type
# entirely (see setup_ua_note_types.py) in favor of the single CompareMembers JSON field.
# Since then, compare_a/b/c/d and homograph_sense_a/b in this registry were dead data --
# never read by get_cluster_compare_members_json() or any card template -- kept alive only
# by stale tests. They have been stripped from every cluster; compare_scenario and lemma
# are now the only per-member fields that feed a Compare card.
#
# FIELD DEFINITIONS
# =================
#
# Root level:
#   clusters: {dict} All semantic clusters in the registry
#
# Cluster level (per cluster):
#   description: {string} Prose description of semantic relationship and usage context
#   canonical_note: {string} Primary note_id that shows all cluster members on Compare card
#   members: {list} All notes belonging to this cluster
#   show_all_members: {bool, optional, default false} When true, EVERY member's Compare
#     card shows the full active member list (not just the hub's). Use for clusters where
#     every member should see every other member -- e.g. a semantic triplet where each
#     word should be distinguished against both siblings, not just the hub. Added
#     2026-08-28 (fire-general-vs-blaze-vs-campfire) -- see confusable_clusters.py
#     get_compare_card_members().
#
# Member level (per cluster member):
#   note_id: {string} Unique identifier (ua-lexeme-XXXX)
#   lemma: {string} Word with stress marks (U+0301)
#   status: {string} Verification status (sourced, draft, verified, etc.)
#   chapter: {string} Textbook chapter reference
#   comment: {string} Editorial notes on sourcing or verification
#   compare_scenario: {string} Usage context that distinguishes this word from cluster-mates.
#     Still used for chip-mode Compare cards -- see example_ua/meaning_en below for the
#     alternative used by true-homophone clusters.
#   example_ua: {string, optional} Sentence-mode only (added 2026-08-30). An authored UA
#     sentence demonstrating this member's specific sense, copied from that note's own
#     UA_Example field. Used instead of compare_scenario/chip rendering whenever a
#     cluster's active members share an IDENTICAL lemma string -- a true homophone,
#     where nothing in the word itself (spelling or stress) distinguishes the senses, so
#     a word-chip choice would just repeat the same word twice. get_cluster_compare_
#     members_json() (tools/anki/sync/ua_lexeme_import.py) auto-detects this case (every
#     active member's lemma equal) and switches CompareMembers to {"mode": "sentence",
#     "items": [...]} automatically -- no per-cluster opt-in flag needed. Required
#     (alongside meaning_en) on every member of such a cluster.
#   meaning_en: {string, optional} Sentence-mode only. The English meaning revealed as
#     the answer for this member's example_ua sentence -- usually the comment field's
#     content, lightly trimmed of cluster-hierarchy meta-notes ("primary sense", "this
#     note", etc.) that only make sense inside the registry, not on a card.
#
# VALIDATION RULES
# ================
#
# - All members MUST have compare_scenario populated (100% coverage required)
# - All note_ids must exist in domains/ua/anki/notes/lexemes/
# - Lemmas must match corpus lemmas (stress-stripped comparison)
# - canonical_note must be a member of the cluster
# - No duplicate note_ids within a single cluster
# - Any cluster whose active members share an identical lemma (sentence mode) MUST have
#   example_ua and meaning_en populated on every one of those members
#
# LAST UPDATED: 2026-08-30 (added example_ua/meaning_en sentence-mode fields for
#   true-homophone clusters -- party-game-homograph, crayfish-cancer-homograph,
#   knife-than-homograph, bench-homograph, seem-emerge-homograph, departure-homograph,
#   grammatical-aspect, butterfly-homograph)
# COVERAGE: 84/84 members have compare_scenario (100%); 16/16 sentence-mode members
#   also have example_ua/meaning_en (100%)
#

clusters:
  intensifier-adverbs:
    description: 'Two related pairs of degree/intensity adverbs sharing overlapping EN
      glosses ("very/much/too"): значно (formal, measured) and набагато (everyday,
      conversational) both intensify a COMPARATIVE ("X-er than Y"); занадто (general
      "too/excessively," for adjectives/adverbs) and забагато (fused "too much," specific
      to quantity/amount) both mark an ABSOLUTE excess past an acceptable limit, with no
      comparison implied. Grouped per Craig''s request (2026-08-28) to cluster занадто
      with terms of similar EN meaning or UA spelling.

      '
    show_all_members: true
    canonical_note: ua-lexeme-0467
    members:
    - note_id: ua-lexeme-0467
      lemma: зна́чно
      status: sourced
      chapter: 2.8.3
      comment: Formal, measured intensifier for written/analytical comparisons (Горох-verified)
      compare_scenario: A market report states that prices this year are considerably
        higher than last year -- the kind of measured comparison you'd read in a news
        analysis or official statistics.
    - note_id: ua-lexeme-0468
      lemma: набага́то
      status: sourced
      chapter: 2.8.3
      comment: Everyday conversational intensifier (Горох-verified)
      compare_scenario: Comparing two hotel rooms right after checking in, you tell
        a friend casually that this room is way comfier than the other one.
    - note_id: ua-lexeme-0417
      lemma: зана́дто
      status: sourced
      chapter: '2.8.1'
      comment: General "too/excessively" -- adjectives/adverbs, absolute excess, no
        comparison (Горох-verified)
      compare_scenario: It's so hot out today that nobody wants to go for a walk --
        the heat has crossed past a comfortable point. What word says that?
    - note_id: ua-lexeme-0615
      lemma: забага́то
      status: sourced
      chapter: 2.8.3
      comment: Fused "too much" -- quantity/amount excess specifically, no comparison
        (Горох-verified)
      compare_scenario: One person has been handed way more work than they can
        reasonably manage alone -- not compared to anyone else's workload, just an
        excessive amount in itself. What word says that?
    - note_id: ua-lexeme-1231
      lemma: зама́ло
      status: sourced
      chapter: '2.3.3'
      comment: Fused "too little/not enough" -- the negative-polarity counterpart of
        забагато, same absolute-excess-vs-deficit category, no comparison (Горох-verified)
      compare_scenario: Only a handful of people showed up to the community meeting --
        nowhere near enough to make any real decisions. What word says that?
  time-of-day:
    description: 'Time-of-day nouns marking points in the daily cycle.

      ранок (early morning) → вечір (late afternoon/evening) → ніч (night/dark hours).

      Hub (ранок) shows all three on Compare card; satellites show hub + self.

      '
    canonical_note: ua-lexeme-0059
    members:
    - note_id: ua-lexeme-0059
      lemma: ра́нок
      status: sourced
      chapter: 2.0
      comment: Early morning; start of day (Горох-verified)
      compare_scenario: The sun has just risen and people are having their first coffee
        or getting ready for the day.
    - note_id: ua-lexeme-0029
      lemma: ве́чір
      status: sourced
      chapter: 2.0
      comment: Late afternoon/evening; end of business day (Горох-verified)
      compare_scenario: The sun has just set and people are finishing dinner, but
        it's not yet late enough for most people to be asleep.
    - note_id: ua-lexeme-0048
      lemma: ніч
      status: sourced
      chapter: 2.0
      comment: Night; dark hours (Горох-verified)
      compare_scenario: It's the middle of the dark hours, well past midnight, when
        most people are asleep.
  response-register-scale:
    description: 'Response words to "How are you?" / "How''s it going?", graded by
      formality and enthusiasm.

      добре (positive, formal) → непогано (neutral) → нормально (bland) → чудово (very
      positive).

      Register and speaker intent differ despite overlapping EN glosses ("good/fine/well").

      '
    canonical_note: ua-lexeme-0100
    members:
    - note_id: ua-lexeme-0100
      lemma: непога́но
      status: sourced
      chapter: 2.0
      comment: Neutral; "not bad" / "getting by" (Горох-verified)
      compare_scenario: A coworker asks how your week went. It was fine but unremarkable
        -- you don't want to oversell it, just acknowledge it wasn't bad.
    - note_id: ua-lexeme-0099
      lemma: до́бре
      status: sourced
      chapter: 2.0
      comment: Positive response; formal or neutral tone (Горох-verified)
      compare_scenario: A friend asks how your exam went. You did solidly and feel
        satisfied -- no fireworks, just a plain, straightforwardly positive result.
    - note_id: ua-lexeme-0101
      lemma: норма́льно
      status: sourced
      chapter: 2.0
      comment: Bland/neutral; mundane "okay" with less warmth (Горох-verified)
      compare_scenario: Someone asks how you're doing on an ordinary Tuesday. Nothing
        noteworthy happened either way -- this is the reflexive, default reply to
        a routine "how are you?"
    - note_id: ua-lexeme-0104
      lemma: чудо́во
      status: sourced
      chapter: 2.0
      comment: Very positive; enthusiastic "wonderful/great" (Горох-verified)
      compare_scenario: A friend asks how your vacation was. It exceeded expectations
        and you want to convey real excitement, not just satisfaction.
  pvom-prefix-walking:
    description: 'Walking prefix distinctions: до- (arrival/destination) vs під- (approach)
      vs в- (entry/ingress).

      All three combine with ходити root. Compare card drills which prefix carries
      which spatial nuance.

      '
    canonical_note: ua-lexeme-0117
    members:
    - note_id: ua-lexeme-0117
      lemma: підхо́дити
      status: sourced
      chapter: 2.9
      comment: 'під + ходити: approach/come up to (draw near, but not necessarily
        enter)'
      compare_scenario: Someone is walking closer and closer to a friend waiting across
        the room, but hasn't arrived yet.
    - note_id: ua-lexeme-0119
      lemma: дохо́дити
      status: sourced
      chapter: 2.9
      comment: 'до + ходити: reach/arrive at (destination reached)'
      compare_scenario: Someone finally arrives at their destination, on foot, after
        a long walk.
    - note_id: ua-lexeme-0115
      lemma: вхо́дити
      status: sourced
      chapter: 2.9
      comment: 'в + ходити: enter/go inside (cross threshold)'
      compare_scenario: Someone walks into a building through the front door, on foot.
  alphabet-types:
    description: 'Two words for "alphabet": абетка emphasizes the learning/childhood
      context (ABC primer),

      while алфавіт is the neutral, technical term for the letter system itself.

      '
    canonical_note: ua-lexeme-0023
    members:
    - note_id: ua-lexeme-0023
      lemma: алфа́ві́т
      status: sourced
      chapter: 2.0
      comment: Alphabet (neutral, technical term for the letter system)
      compare_scenario: Stating a neutral linguistic fact, such as how many letters
        a language's writing system has.
    - note_id: ua-lexeme-0022
      lemma: абе́тка
      status: sourced
      chapter: 2.0
      comment: ABC primer (learning context, especially childhood)
      compare_scenario: Describing a colorful picture book aimed at small children
        who are just learning their letters for the first time.
  gender-student:
    description: 'Gender pair for student: студент (m.) and студентка (f.).

      Same referent, different grammatical gender.

      '
    canonical_note: ua-lexeme-0015
    members:
    - note_id: ua-lexeme-0015
      lemma: студе́нт
      status: sourced
      chapter: 2.0
      comment: Student (masculine)
      compare_scenario: Introducing a male university student to a group of people
        who haven't met him before.
    - note_id: ua-lexeme-0016
      lemma: студе́нтка
      status: sourced
      chapter: 2.0
      comment: Student (feminine)
      compare_scenario: Introducing a female university student to a group of people
        who haven't met her before.
  writing-implements:
    description: 'Two common writing implements: ручка (pen - typical for everyday
      writing) and олівець (pencil - erasable).

      Different objects, both used for handwriting.

      '
    canonical_note: ua-lexeme-0061
    members:
    - note_id: ua-lexeme-0061
      lemma: ру́чка
      status: sourced
      chapter: 2.0
      comment: Pen (ballpoint or gel pen for permanent writing)
      compare_scenario: Signing an official document or writing a permanent note that
        shouldn't be erased.
    - note_id: ua-lexeme-0049
      lemma: оліве́ць
      status: sourced
      chapter: 2.0
      comment: Pencil (graphite pencil, erasable)
      compare_scenario: Sketching a drawing you plan to revise, or filling in a standardized
        test form that requires erasable marks.
  classroom-furniture:
    description: 'Two pieces of classroom furniture: парта (school desk with attached
      seat or standalone)

      and стілець (chair - just the seating, no desk).

      '
    canonical_note: ua-lexeme-0053
    members:
    - note_id: ua-lexeme-0053
      lemma: па́рта
      status: sourced
      chapter: 2.0
      comment: School desk (often with attached seat or chair)
      compare_scenario: Describing the classroom furniture where a student sits and
        places their notebook during a lesson.
    - note_id: ua-lexeme-0064
      lemma: стіле́ць
      status: sourced
      chapter: 2.0
      comment: Chair (seat without desk attached)
      compare_scenario: Describing a standalone seat with no attached desk surface,
        such as at a dinner table or in a waiting room.
  profession-expertise:
    description: 'Two words for work/job: професія (broad term for profession/occupation)
      and фах (skilled trade or craft).

      Profession is formal/general; фах emphasizes specialized expertise and manual
      skill.

      '
    canonical_note: ua-lexeme-0058
    members:
    - note_id: ua-lexeme-0058
      lemma: профе́сія
      status: sourced
      chapter: 2.0
      comment: Profession, occupation (broad, formal term)
      compare_scenario: Filling out an official form that asks for your occupation,
        or introducing yourself formally by career at a professional networking event.
  scoring-points:
    description: 'Two words for points/scores: очко (in sports/games context, e.g.,
      tennis points)

      and бал (unit of scoring, e.g., grades, competition points).

      Both translate "point" but used in different contexts.

      '
    canonical_note: ua-lexeme-0203
    members:
    - note_id: ua-lexeme-0203
      lemma: очко́
      status: sourced
      chapter: 2.9
      comment: Point (in sports/games, e.g., tennis score)
      compare_scenario: A basketball game is tied with five seconds left on the clock,
        and a player sinks a shot right at the buzzer.
    - note_id: ua-lexeme-0252
      lemma: бал
      status: sourced
      chapter: 2.9
      comment: Point, score (unit of evaluation, e.g., grades, competition scoring)
      compare_scenario: A gymnast finishes her routine, and the judges hold up number
        cards showing how they rated her performance.
  sharp-descriptors:
    description: 'Two words for "sharp": гострий (sharp object or taste - spicy/hot
      food)

      and різкий (sharp change - abrupt, sudden movement, sound, or intensity).

      Different senses of "sharp" (object property vs. change property).

      '
    canonical_note: ua-lexeme-0503
    members:
    - note_id: ua-lexeme-0503
      lemma: го́стрий
      status: sourced
      chapter: 2.8
      comment: Sharp (pointed object); spicy, hot (of food)
      compare_scenario: The chef warns that the soup is far too spicy, there is too
        much pepper in it.
    - note_id: ua-lexeme-0586
      lemma: різки́й
      status: sourced
      chapter: 2.8
      comment: Sharp, abrupt, sudden (change, movement, sound, intensity)
      compare_scenario: The driver swerves hard and sudden to dodge a dog that darted
        into the road.
  butterfly-homograph:
    description: 'Stress-shift homograph on мете́лик: butterfly (primary sense, common)

      and bow-tie / informal: flyer, leaflet (secondary sense, less common).

      '
    canonical_note: ua-lexeme-0171
    members:
    - note_id: ua-lexeme-0171
      lemma: мете́лик
      status: sourced
      chapter: 2.9
      comment: Butterfly (the insect - primary, common sense)
      compare_scenario: Which sense of метелик is being used?
      example_ua: Метелик сів на квітку.
      meaning_en: Butterfly (the insect)
    - note_id: ua-lexeme-0181
      lemma: мете́лик
      status: sourced
      chapter: 2.9
      comment: 'Bow-tie (menswear accessory); informal: flyer, leaflet'
      compare_scenario: Which sense of метелик is being used?
      example_ua: Він одягнув чорний метелик до смокінга.
      meaning_en: 'Bow-tie (menswear accessory); informal: flyer, leaflet'
  crayfish-cancer-homograph:
    description: 'Pure polysemy homograph (no stress shift) on ра́к: the crustacean

      (crayfish, animate) and the disease (cancer, inanimate). Distinguished

      grammatically, not just semantically -- genitive singular ра́ка (crayfish)

      vs. ра́ку (cancer), animate vs. inanimate accusative.

      '
    canonical_note: ua-lexeme-0542
    members:
    - note_id: ua-lexeme-0542
      lemma: ра́к
      status: sourced
      chapter: 2.8
      comment: Crayfish (animal, animate)
      compare_scenario: Which sense of рак is being used?
      example_ua: На ринку продавали свіжих раків.
      meaning_en: Crayfish (animal, animate)
    - note_id: ua-lexeme-0588
      lemma: ра́к
      status: sourced
      chapter: reference
      comment: Cancer (disease, inanimate)
      compare_scenario: Which sense of рак is being used?
      example_ua: У нього діагностували рак легенів.
      meaning_en: Cancer (disease, inanimate)
  smooth-plump-homograph:
    description: 'Pure stress-shift homograph on гладкий: smooth, even, without

      irregularities (root-stressed гла́дкий) vs. fat, well-fed, plump, full-faced

      (suffix-stressed гладки́й). No shared etymology beyond the spelling --

      distinguished purely by stress placement.

      '
    canonical_note: ua-lexeme-0555
    members:
    - note_id: ua-lexeme-0555
      lemma: гла́дкий
      status: sourced
      chapter: 2.8
      comment: Smooth, even (texture)
      compare_scenario: Which stress/sense of гладкий is being used?
    - note_id: ua-lexeme-0589
      lemma: гладки́й
      status: sourced
      chapter: reference
      comment: Fat, well-fed, plump
      compare_scenario: Which stress/sense of гладкий is being used?
  power-strength-synonyms:
    description: 'Near-synonym cluster for "strong/powerful," per Горох''s Синонімія

      page for потужний. Six words sharing overlapping EN glosses but distinct emphases:

      raw capacity (потужний), general strength (сильний), authority/grandeur (могутній),

      embodied physicality (дужий), durability (міцний), and mere perceptibility

      (відчутний, the outlier -- not about force at all).

      '
    canonical_note: ua-lexeme-0574
    members:
    - note_id: ua-lexeme-0574
      lemma: поту́жний
      status: sourced
      chapter: 2.8
      comment: Powerful -- raw mechanical/operational capacity, technical register
      compare_scenario: You're describing an engine, a loudspeaker, or a machine with a lot of raw output
        capacity -- which word fits best?
    - note_id: ua-lexeme-0590
      lemma: си́льний
      status: sourced
      chapter: reference
      comment: Strong -- the broadest, most general-purpose term
      compare_scenario: You want the single most general, all-purpose word for 'strong' -- physical,
        character, or intensity, with no special nuance implied.
    - note_id: ua-lexeme-0591
      lemma: могу́тній
      status: sourced
      chapter: reference
      comment: Mighty -- authority and grandeur, commanding scale
      compare_scenario: You're describing an empire, a ruler, or an ancient forest -- something commanding
        and grand in scale, not just physically strong.
    - note_id: ua-lexeme-0592
      lemma: ду́жий
      status: sourced
      chapter: reference
      comment: Robust, vigorous -- embodied physical build, literary register
      compare_scenario: You're describing someone's robust physical build in a folk-tale or literary style --
        less formal/grand than могутній, more concretely physical than сильний.
    - note_id: ua-lexeme-0593
      lemma: міцни́й
      status: sourced
      chapter: reference
      comment: Sturdy, durable -- resistance to breaking, structural integrity
      compare_scenario: You're describing a rope, fabric, or friendship that resists breaking or wearing out --
        durability and structural integrity, not raw force.
    - note_id: ua-lexeme-0594
      lemma: відчу́тний
      status: sourced
      chapter: reference
      comment: Noticeable, perceptible -- detectability, not force
      compare_scenario: You want to say an effect or difference was noticeable/perceptible enough to register --
        not that it was powerful or strong, just detectable.
  castle-lock-homograph:
    description: 'Stress-shift homograph on замок: за́мок castle (primary Яблуко

      vocabulary sense, ch.2.3.4) and замо́к lock/latch (reference-only companion,

      added to complete the pair).

      '
    canonical_note: ua-lexeme-1282
    members:
    - note_id: ua-lexeme-1282
      lemma: за́мок
      status: sourced
      chapter: '2.3.4'
      comment: Castle (heritage architecture, ch.3.4 wordlist item)
      compare_scenario: Which sense of замок is being used?
    - note_id: ua-lexeme-1302
      lemma: замо́к
      status: sourced
      chapter: reference
      comment: Lock, latch (reference-only companion note, not itself a wordlist item)
      compare_scenario: Which sense of замок is being used?
  amazing-impressive-synonyms:
    description: 'Convergent near-synonym pair (not homographs), both translatable as

      "amazing"/"impressive" in English: вражаючий emphasizes the effect of impressing

      through scale, quality, or skill, while дивовижний emphasizes wonder or surprise.

      '
    canonical_note: ua-lexeme-0571
    members:
    - note_id: ua-lexeme-0571
      lemma: вража́ючий
      status: sourced
      chapter: '2.8.7'
      comment: Impressive, striking -- effect of impressing through scale/quality/skill
      compare_scenario: Do you mean something that impresses through its scale, quality,
        or skill (вражаючий), or something that provokes wonder/surprise (дивовижний)?
    - note_id: ua-lexeme-0572
      lemma: дивови́жний
      status: sourced
      chapter: '2.8.7'
      comment: Amazing, astonishing -- emphasizes wonder or surprise
      compare_scenario: Do you mean something that provokes wonder/surprise (дивовижний),
        or something that impresses through its scale, quality, or skill (вражаючий)?
  knife-than-homograph:
    description: 'Pure polysemy homograph (no stress shift) on ніж: knife (noun)

      and "than" (comparative conjunction).

      '
    canonical_note: ua-lexeme-0047
    members:
    - note_id: ua-lexeme-0047
      lemma: ніж
      status: sourced
      chapter: '1.0'
      comment: Knife (noun)
      compare_scenario: Which sense of ніж is being used?
      example_ua: Кухар ріже хліб гострим ножем.
      meaning_en: Knife (noun)
    - note_id: ua-lexeme-1270
      lemma: ніж
      status: sourced
      chapter: '2.3.4'
      comment: '"Than" (comparative conjunction)'
      compare_scenario: Which sense of ніж is being used?
      example_ua: Цей фасад гарніший, ніж той.
      meaning_en: '"Than" (comparative conjunction)'
  ancient-synonyms:
    description: 'Convergent near-synonym pair (not homographs), both meaning "ancient,

      age-old": Горох lists them as synonyms of each other, minimal EN-distinguishable

      difference.

      '
    canonical_note: ua-lexeme-1257
    members:
    - note_id: ua-lexeme-1257
      lemma: старода́вній
      status: sourced
      chapter: '2.3.4'
      comment: Ancient, age-old
      compare_scenario: Which of these near-synonyms for "ancient" fits best here?
    - note_id: ua-lexeme-1254
      lemma: дре́вній
      status: sourced
      chapter: '2.3.4'
      comment: Ancient, age-old
      compare_scenario: Which of these near-synonyms for "ancient" fits best here?
  bench-homograph:
    description: 'Stress-shift homograph on ла́вка: bench for sitting (primary sense)

      and market stall / shop (secondary sense).

      '
    canonical_note: ua-lexeme-0372
    members:
    - note_id: ua-lexeme-0372
      lemma: ла́вка
      status: sourced
      chapter: 2.9
      comment: Bench (for sitting, in park or classroom)
      compare_scenario: Which sense of лавка is being used?
      example_ua: Він сід на лавку в парку, щоб трохи відпочити.
      meaning_en: Bench (for sitting, in park or classroom)
    - note_id: ua-lexeme-0235
      lemma: ла́вка
      status: sourced
      chapter: 2.9
      comment: Market stall, shop stand (street vendor's bench)
      compare_scenario: Which sense of лавка is being used?
      example_ua: Вона купила букет троянд у квітковій лавці на ринку.
      meaning_en: Market stall, shop stand (street vendor's bench)
  seem-emerge-homograph:
    description: 'Pure polysemy homograph (no stress shift) on вигляда́ти: to seem, to have

      a certain appearance (stative sense, no perfective partner) and to look out, to emerge,

      to become visible (event sense, pairs with perfective ви́глянути).

      '
    canonical_note: ua-lexeme-0550
    members:
    - note_id: ua-lexeme-0550
      lemma: вигляда́ти
      status: sourced
      chapter: '2.8'
      comment: To seem, to appear a certain way (stative/copular, imperfective-only)
      compare_scenario: Which sense of виглядати is being used?
      example_ua: Ця страва виглядає досить незвично.
      meaning_en: To seem, to appear a certain way
    - note_id: ua-lexeme-0587
      lemma: вигляда́ти
      status: sourced
      chapter: '2.8'
      comment: To look out, emerge, become visible (event sense, pairs with perfective ви́глянути)
      compare_scenario: Which sense of виглядати is being used?
      example_ua: Сонце виглядало з-за хмар.
      meaning_en: To look out, emerge, become visible
  departure-homograph:
    description: 'Stress-shift homograph on відпра́влення: departure (primary sense,
      travel context)

      and parcel / mailed item (secondary sense, postal context).

      '
    canonical_note: ua-lexeme-0304
    members:
    - note_id: ua-lexeme-0304
      lemma: відпра́влення
      status: sourced
      chapter: 2.9
      comment: Departure (of a train, bus, person - leaving to go somewhere)
      compare_scenario: Which sense of відправлення is being used?
      example_ua: Час відправлення поїзда -- девʼята вечора.
      meaning_en: Departure (of a train, bus, person - leaving to go somewhere)
    - note_id: ua-lexeme-0380
      lemma: відпра́влення
      status: sourced
      chapter: 2.9
      comment: Parcel, mailed item (letter or package sent by mail)
      compare_scenario: Which sense of відправлення is being used?
      example_ua: Ваше відправлення готове до отримання на пошті.
      meaning_en: Parcel, mailed item (letter or package sent by mail)
  grammatical-aspect:
    description: 'Stress-shift homograph on вид: aspect (grammatical: perfective vs.
      imperfective distinction)

      and kind / type (e.g., "вид спорту" = type of sport).

      '
    canonical_note: ua-lexeme-0182
    members:
    - note_id: ua-lexeme-0182
      lemma: вид
      status: sourced
      chapter: 2.9
      comment: 'Aspect (grammatical term: perfective vs. imperfective)'
      compare_scenario: You're learning about verb grammar—what word describes whether
        a verb is completed or ongoing?
      example_ua: У реченні «Я прочитав книгу» дієслово «прочитати» має доконаний вид.
      meaning_en: 'Aspect (grammatical term: perfective vs. imperfective)'
    - note_id: ua-lexeme-0143
      lemma: вид
      status: sourced
      chapter: 2.9
      comment: Kind, type (e.g., "вид спорту" = type/category of sport)
      compare_scenario: You're discussing different categories of something—what word
        means a specific type or variety?
      example_ua: Який вид спорту тобі найбільше подобається?
      meaning_en: Kind, type
  warmth-adverb:
    description: 'Stress-shift homograph on тепло́/те́пло: warmth (noun, abstract
      or physical sensation)

      and warmly (adverb, manner of speaking or acting).

      '
    canonical_note: ua-lexeme-0407
    members:
    - note_id: ua-lexeme-0407
      lemma: тепло́
      status: sourced
      chapter: 2.8
      comment: Warmth (noun; physical heat or abstract comfort)
      compare_scenario: Which sense of тепло is being used?
    - note_id: ua-lexeme-0405
      lemma: те́пло
      status: sourced
      chapter: 2.8
      comment: Warmly (adverb; manner or tone of speaking/acting)
      compare_scenario: Which sense of тепло is being used?
  walking-arrival-departure:
    description: 'Walking verb pair: прихо́дити (come/arrive on foot) and відхо́дити
      (walk away, depart).

      Directional opposites for bipedal motion.

      '
    canonical_note: ua-lexeme-0114
    members:
    - note_id: ua-lexeme-0114
      lemma: прихо́дити
      status: sourced
      chapter: 2.9
      comment: Come, arrive (on foot - approaching movement)
      compare_scenario: A guest arrives at your door, on foot, for a party you're
        hosting.
    - note_id: ua-lexeme-0118
      lemma: відхо́дити
      status: sourced
      chapter: 2.9
      comment: Walk away, depart (on foot - leaving movement)
      compare_scenario: A guest says goodbye and walks away from your door, on foot,
        at the end of the evening.
  walking-entry-exit:
    description: 'Walking verb pair: вхо́дити (enter, go in) and вихо́дити (go out,
      exit).

      Directional opposites for crossing a threshold.

      '
    canonical_note: ua-lexeme-0115
    members:
    - note_id: ua-lexeme-0115
      lemma: вхо́дити
      status: sourced
      chapter: 2.9
      comment: Enter, go in (on foot - crossing threshold inward)
      compare_scenario: Someone walks into a building through the front door, on foot.
    - note_id: ua-lexeme-0116
      lemma: вихо́дити
      status: sourced
      chapter: 2.9
      comment: Go out, exit (on foot - crossing threshold outward)
      compare_scenario: Someone walks out of a building through the front door, on
        foot.
  walking-passage:
    description: 'Walking verb pair: прохо́дити (pass by, walk past, pass through
      a space)

      and перехо́дити (cross, go to the far side, traverse to opposite side).

      Both involve traversing; перехо́дити implies reaching the far side.

      '
    canonical_note: ua-lexeme-0120
    members:
    - note_id: ua-lexeme-0120
      lemma: прохо́дити
      status: sourced
      chapter: 2.9
      comment: Pass by, walk past (on foot - transiting through)
      compare_scenario: Someone is walking along a street, passing several shops without
        stopping, on the way somewhere else.
    - note_id: ua-lexeme-0121
      lemma: перехо́дити
      status: sourced
      chapter: 2.9
      comment: Cross, go across (on foot - reaching the far side)
      compare_scenario: Someone is walking across a street at a crosswalk, from one
        side to the other.
  vehicle-directions:
    description: 'Vehicle verb pair: вʼїжджа́ти (drive in, enter by vehicle) and виїжджа́ти
      (drive out, exit by vehicle).

      Directional opposites for vehicular motion.

      '
    canonical_note: ua-lexeme-0124
    members:
    - note_id: ua-lexeme-0124
      lemma: вʼїжджа́ти
      status: sourced
      chapter: 2.9
      comment: Drive in, into (by vehicle - entering motion)
      compare_scenario: A car turns into a parking garage or driveway.
    - note_id: ua-lexeme-0125
      lemma: виїжджа́ти
      status: sourced
      chapter: 2.9
      comment: Drive out (by vehicle - exiting motion)
      compare_scenario: A car pulls out of a parking garage or driveway onto the street.
  vehicle-approach-reach:
    description: 'Vehicle verb pair: підʼїжджа́ти (drive up to, approach by vehicle)

      and доїжджа́ти (reach, get to, arrive at destination by vehicle).

      Similar to walking approach/reach pair but for vehicular motion.

      '
    canonical_note: ua-lexeme-0126
    members:
    - note_id: ua-lexeme-0126
      lemma: підʼїжджа́ти
      status: sourced
      chapter: 2.9
      comment: Drive up to (by vehicle - approach motion)
      compare_scenario: A taxi slowly pulls up next to the curb where you're waiting,
        not yet having arrived at the final destination.
    - note_id: ua-lexeme-0128
      lemma: доїжджа́ти
      status: sourced
      chapter: 2.9
      comment: Reach, get to (by vehicle - destination arrival)
      compare_scenario: A car finally arrives at the destination after a long drive.
  vehicle-passage:
    description: 'Vehicle verb pair: проїжджа́ти (drive past, pass through) and переїжджа́ти
      (cross, go across).

      Similar to walking passage pair but for vehicular motion; переїжджа́ти also
      means to relocate.

      '
    canonical_note: ua-lexeme-0129
    members:
    - note_id: ua-lexeme-0129
      lemma: проїжджа́ти
      status: sourced
      chapter: 2.9
      comment: Drive past, pass through (by vehicle - transiting)
      compare_scenario: Driving along a highway, passing several towns without stopping,
        on a long road trip.
    - note_id: ua-lexeme-0130
      lemma: переїжджа́ти
      status: sourced
      chapter: 2.9
      comment: Cross (by vehicle - reaching far side); to relocate
      compare_scenario: Driving across a bridge from one side of a river to the other
        -- or, in its extended sense, a family moving their household to a new city.
  sports-action-verbs:
    description: 'Four-member cluster of ball/impact-game action verbs, each answering
      a different question

      about where the force ends up or what the result is. All gloss roughly to "hit/strike/score"

      but the semantic distinction matters in games context.

      відбивати: hit back, deflect, return (defensive action; in tennis, returning
      opponent''s shot)

      забивати: score, hit into goal (offensive action; driving ball into goal)

      завдавати: deal, inflict (combat context; striking a person, not a ball)

      набирати: accumulate, rack up (scorekeeping; the scoreboard number increasing,
      not the physical action)

      '
    canonical_note: ua-lexeme-0213
    members:
    - note_id: ua-lexeme-0213
      lemma: відбива́ти
      status: sourced
      chapter: 2.9
      comment: Hit back, deflect, return (defensive action; returning opponent's shot)
      compare_scenario: During a long volleyball rally, what does a player keep doing
        every time the ball comes flying at them?
    - note_id: ua-lexeme-0214
      lemma: забива́ти
      status: sourced
      chapter: 2.9
      comment: Score, hit into goal (offensive action; driving ball into goal or net)
      compare_scenario: Game after game, this striker has a habit of doing what to
        the ball -- putting it in the back of the net?
    - note_id: ua-lexeme-0215
      lemma: завдава́ти
      status: sourced
      chapter: 2.9
      comment: Deal, inflict (combat; striking a person, not a ball)
      compare_scenario: Round after round, what does this boxer keep doing with his
        fists -- not to a ball, but to the man across from him?
    - note_id: ua-lexeme-0218
      lemma: набира́ти
      status: sourced
      chapter: 2.9
      comment: Gain, accumulate, rack up (scorekeeping; the tally increasing, not
        the physical strike)
      compare_scenario: As the second half goes on, what keeps happening to the leading
        team's number on the scoreboard?
  win-beat-verbs:
    description: 'Two near-synonyms for "win": перемага́ти (defeat, overcome, win
      against someone/something)

      and виграва́ти (win, gain victory, win a game/prize).

      перемага́ти emphasizes overcoming an opponent; виграва́ти emphasizes gaining
      the prize.

      '
    canonical_note: ua-lexeme-0177
    members:
    - note_id: ua-lexeme-0177
      lemma: перемага́ти
      status: sourced
      chapter: 2.9
      comment: Defeat, overcome, win against (emphasizes overcoming opponent)
      compare_scenario: In the championship boxing match, what did the challenger
        do to the reigning champion?
    - note_id: ua-lexeme-0212
      lemma: виграва́ти
      status: sourced
      chapter: 2.9
      comment: Win, gain (emphasizes gaining the prize or victory)
      compare_scenario: At the poker table, what does a player do to walk away with
        the whole pot?
  race-start-loanword:
    description: 'Loanword verb for starting a race: стартува́ти.

      Compare to native Ukrainian почина́ти/поча́ти for "begin" more generally.

      '
    canonical_note: ua-lexeme-0291
    members:
    - note_id: ua-lexeme-0291
      lemma: стартува́ти
      status: sourced
      chapter: 2.9
      comment: Start (a race - loanword from English "start")
      compare_scenario: The referee fires the starting pistol and the runners take
        off.
  race-finish-loanword:
    description: 'Loanword verb for finishing a race: фінішува́ти.

      Compare to native Ukrainian закі́нчувати/закі́нчити for "finish" more generally.

      '
    canonical_note: ua-lexeme-0292
    members:
    - note_id: ua-lexeme-0292
      lemma: фінішува́ти
      status: sourced
      chapter: 2.9
      comment: Finish (a race - loanword from English "finish")
      compare_scenario: The first runner breaks the tape at the finish line.
  running-racing:
    description: 'Running/racing noun: біг (the act of running, or racing on foot)

      vs. перего́ни (competitive racing by any means -- ski, car, boat, horse, etc.).

      '
    canonical_note: ua-lexeme-0145
    members:
    - note_id: ua-lexeme-0145
      lemma: біг
      status: sourced
      chapter: 2.9
      comment: Running, race (on foot - the act or the event)
      compare_scenario: You're describing training for or watching a marathon or a
        school sprint event -- a competition specifically involving running on foot.
    - note_id: ua-lexeme-0144
      lemma: перего́ни
      status: sourced
      chapter: '2.9.1'
      comment: Racing by any means of transport/method (ski, car, boat, horse, etc.)
      compare_scenario: You're describing a ski race, car race, boat race, or horse
        race -- a competition not specifically involving running on foot.
  transportation-arrival:
    description: 'Arrival in transportation context: прибуття́ (the noun - arrival
      event)

      is paired with related transportation verbs; related to прибува́ти (to arrive).

      '
    canonical_note: ua-lexeme-0305
    members:
    - note_id: ua-lexeme-0305
      lemma: прибуття́
      status: sourced
      chapter: 2.9
      comment: Arrival (noun; transportation context on schedule boards)
      compare_scenario: At the station, the 9pm train from Lviv pulls in and stops
        at the platform. What just happened to it?
  transportation-verbs:
    description: 'Two verbs related to transportation: відправля́тися (to depart,
      set off)

      and прибува́ти (to arrive).

      Often appear as paired opposites on transportation schedule boards: "Відпр./Приб."

      '
    canonical_note: ua-lexeme-0315
    members:
    - note_id: ua-lexeme-0315
      lemma: відправля́тися
      status: sourced
      chapter: 2.9
      comment: To depart, set off (especially of transportation - train, bus, plane)
      compare_scenario: The departures board at the station shows what a train does
        at exactly nine in the evening.
    - note_id: ua-lexeme-0316
      lemma: прибува́ти
      status: sourced
      chapter: 2.9
      comment: To arrive (especially of transportation - train, bus, plane)
      compare_scenario: A conductor makes an announcement over the station loudspeaker
        about when the train gets in.
  journey-trip-synonyms:
    description: 'Near-synonyms for journey/trip: мандрівка (adventurous, wandering
      connotation) vs подорож (the neutral, general-purpose word). Горох defines
      мандрівка sense 1 directly as "подорож (у 1 знач.)", with sense 2 adding a
      "constant change of location, wandering" (блукання) nuance подорож lacks.

      '
    canonical_note: ua-lexeme-0330
    members:
    - note_id: ua-lexeme-0330
      lemma: мандрі́вка
      status: sourced
      chapter: 2.9.7
      comment: Adventurous/wandering connotation; Горох's sense 2 adds "constant
        change of location, wandering" that подорож lacks.
      compare_scenario: You're describing backpacking through a few different
        towns with no fixed itinerary, just following your curiosity -- which
        word for "trip" carries that wandering, adventurous feel?
    - note_id: ua-lexeme-0595
      lemma: по́дорож
      status: sourced
      chapter: reference
      comment: The neutral, general-purpose word for journey/trip; Горох's sense
        1 of мандрівка is defined directly as this word.
      compare_scenario: You're describing a business trip or a flight to visit
        family -- ordinary, purposeful travel with no wandering or adventurous
        connotation -- which is the default, all-purpose word for "trip"?
  drawing-nouns:
    description: 'Near-synonyms for drawing as product, act, and craft: малюнок
      (the finished picture) vs малювання (the act of drawing) vs малярство (the
      discipline/craft of painting or drawing broadly).

      '
    canonical_note: ua-lexeme-0042
    members:
    - note_id: ua-lexeme-0042
      lemma: малю́нок
      status: sourced
      chapter: '1.0'
      comment: The finished drawing/picture itself (product of малювати).
      compare_scenario: Your child hands you the finished piece of paper with
        colored pencil marks on it -- what do you call the actual picture they
        made?
    - note_id: ua-lexeme-0596
      lemma: малюва́ння
      status: sourced
      chapter: reference
      comment: The act/process of drawing or painting (verbal noun of малювати).
      compare_scenario: You're describing what your child was doing for the last
        hour with a box of pencils, not what they produced -- what word names
        the activity itself?
    - note_id: ua-lexeme-0597
      lemma: маля́рство
      status: sourced
      chapter: reference
      comment: The discipline or craft of painting/drawing broadly (also, the house-painting
        trade).
      compare_scenario: You're describing painting as a discipline or craft someone
        studies and practices, not a specific picture or the single act of making
        one -- what word names the art/craft as a whole?
  painting-nouns:
    description: 'Near-synonyms for painting as art form, product, and mural: живопис
      (the art form/medium) vs картина (a specific painting/canvas) vs розпис
      (painted decoration on a wall or building).

      '
    canonical_note: ua-lexeme-0599
    members:
    - note_id: ua-lexeme-0598
      lemma: живо́пис
      status: sourced
      chapter: reference
      comment: Painting as an art form/genre (paint medium), largely synonymous
        with малярство sense 1.
      compare_scenario: You're talking about painting as an entire art form/genre,
        not any single piece -- what word names the medium itself?
    - note_id: ua-lexeme-0599
      lemma: карти́на
      status: sourced
      chapter: reference
      comment: A specific painting/picture as a physical object (canvas).
      compare_scenario: You're pointing at a specific framed piece hanging on
        the wall in a museum -- what do you call that individual object?
    - note_id: ua-lexeme-0600
      lemma: ро́зпис
      status: sourced
      chapter: reference
      comment: A painted mural or ornamental design on a wall/surface/object.
      compare_scenario: You're looking at a painted design covering a church
        ceiling or the side of a building, not a framed canvas -- what word names
        that kind of painted decoration?
  party-game-homograph:
    description: 'Pure polysemy homograph (no stress shift) on па́ртія: political party
      (primary, most common sense) and a single round of a board/card game -- "a game
      (chess, cards, etc.) from start to finish" per Горох''s Тлумачення entry.

      '
    canonical_note: ua-lexeme-0378
    members:
    - note_id: ua-lexeme-0378
      lemma: па́ртія
      status: sourced
      chapter: '2.9.3'
      comment: Political party (common, general-purpose sense)
      compare_scenario: Which sense of партія is being used?
      example_ua: Ця партія перемогла на виборах.
      meaning_en: Political party
    - note_id: ua-lexeme-0186
      lemma: па́ртія
      status: sourced
      chapter: '2.9.3'
      comment: A single round of a board/card game (chess, cards), start to finish
      compare_scenario: Which sense of партія is being used?
      example_ua: Ми зіграли ще одну партію в шахи.
      meaning_en: A single round of a board/card game (chess, cards), start to finish
  game-match-phrases:
    description: 'Near-synonym verb-phrases for winning a game: ви́грати па́ртію (a single
      round of a board/card game -- chess, cards) vs ви́грати матч (a scheduled athletic
      contest -- football, tennis, boxing). Mirrors the underlying па́ртія/матч noun-level
      distinction (see party-game-homograph and the standalone матч note, ua-lexeme-0604).

      '
    canonical_note: ua-lexeme-0226
    members:
    - note_id: ua-lexeme-0226
      lemma: ви́грати па́ртію
      status: sourced
      chapter: '2.9.3'
      comment: To win a single round of a board/card game (chess, cards)
      compare_scenario: After a long, close game of chess, one player finally checkmates
        the other -- what's the natural way to say they won?
    - note_id: ua-lexeme-0605
      lemma: ви́грати матч
      status: sourced
      chapter: '2.9.3'
      comment: To win a scheduled athletic contest (football, tennis, boxing)
      compare_scenario: A football team scores the winning goal in the final minute
        of a scheduled match -- what's the natural way to say they won?
  painting-verbs:
    description: 'Near-synonyms for applying paint/color: малювати (to draw, basic
      picture-making) vs розписувати (to decorate/sign) vs фарбувати (to apply
      solid color or dye).

      '
    canonical_note: ua-lexeme-1034
    members:
    - note_id: ua-lexeme-1034
      lemma: малюва́ти
      status: sourced
      chapter: '1.11.1'
      comment: Basic verb for making a picture/drawing with pencil, crayon, paint,
        etc.
      compare_scenario: A child is making a picture with a pencil or crayons --
        what's the basic verb for making that kind of image?
    - note_id: ua-lexeme-0602
      lemma: розпи́сувати
      status: sourced
      chapter: reference
      comment: To cover a surface with an ornamental painted design, or to sign/register
        officially.
      compare_scenario: Someone is covering a wall or ceramic surface with an
        ornamental painted pattern, or signing an official document -- which verb
        names that specific action, distinct from plain drawing?
    - note_id: ua-lexeme-0603
      lemma: фарбува́ти
      status: sourced
      chapter: '1.11.4'
      comment: To apply a solid coat of paint (or dye), e.g. a fence, wall, or
        fabric.
      compare_scenario: Someone is covering a fence or wall in a single solid
        color with a paint roller, or dyeing fabric -- which verb names that
        action, distinct from making a picture?

  positional-vs-absolute-lower:
    description: 'Convergent near-synonym TRIPLET (not homographs) on "low/lower": ни́жній is
      a positional/relative adjective (the bottom one of a pair or ordered set -- a lower
      berth, a lower shelf); низьки́й is the absolute POSITIVE degree, describing an object''s
      own height (a low ceiling, a low table), independent of any pairing; ни́жчий is the
      absolute COMPARATIVE degree, for a direct comparison between two things ("X нижчий
      за/ніж Y"). Craig''s own stated confusion (2026-08-28), refined once he noted нижчий
      is the true comparative of низький (not нижній) and that нижчий/нижній -- sharing the
      "ниж-" root -- are the sharper, easier-to-confuse pair. Mirrors positional-vs-absolute-upper
      (ве́рхній/висо́кий/ви́щий).

      '
    show_all_members: true
    canonical_note: ua-lexeme-0312
    members:
    - note_id: ua-lexeme-0312
      lemma: ни́жній
      status: sourced
      chapter: '2.8.2'
      comment: Positional/relative -- the bottom one of a pair or ordered set (a lower berth,
        a lower shelf)
      compare_scenario: You're comparing the bottom bunk to the top bunk on a train -- what
        word describes the bottom one?
    - note_id: ua-lexeme-0433
      lemma: низьки́й
      status: sourced
      chapter: '2.8.2'
      comment: Absolute positive degree -- an object's own height/magnitude (a low ceiling,
        a low table)
      compare_scenario: A ceiling is uncomfortably close to your head -- what word describes
        it?
    - note_id: ua-lexeme-0606
      lemma: ни́жчий
      status: sourced
      chapter: '2.8.2'
      comment: Absolute comparative degree -- a direct comparison between two things ("X is
        lower than Y")
      compare_scenario: You're comparing two rooms directly -- one ceiling is lower than the
        other. What word says that comparison?

  positional-vs-absolute-upper:
    description: 'Convergent near-synonym TRIPLET (not homographs) on "upper/tall": ве́рхній is
      a positional/relative adjective (the top one of a pair or ordered set -- an upper berth,
      an upper shelf); висо́кий is the absolute POSITIVE degree, describing an object''s own
      height (a tall building, a high ceiling), independent of any pairing; ви́щий is the
      absolute COMPARATIVE degree, for a direct comparison between two things ("X вищий за/ніж
      Y"). Mirrors positional-vs-absolute-lower (ни́жній/низьки́й/ни́жчий).

      '
    show_all_members: true
    canonical_note: ua-lexeme-0313
    members:
    - note_id: ua-lexeme-0313
      lemma: ве́рхній
      status: sourced
      chapter: '2.8.2'
      comment: Positional/relative -- the top one of a pair or ordered set (an upper berth,
        an upper shelf)
      compare_scenario: You're comparing the top bunk to the bottom bunk on a train -- what
        word describes the top one?
    - note_id: ua-lexeme-0438
      lemma: висо́кий
      status: sourced
      chapter: '2.8.2'
      comment: Absolute positive degree -- an object's own height/magnitude (a tall building,
        a high ceiling)
      compare_scenario: A building towers over everything else on the street -- what word
        describes it?
    - note_id: ua-lexeme-0607
      lemma: ви́щий
      status: sourced
      chapter: '2.8.2'
      comment: Absolute comparative degree -- a direct comparison between two things ("X is
        taller than Y")
      compare_scenario: You're comparing two buildings directly -- one is taller than the
        other. What word says that comparison?
  greeting-genitive-vs-fixed-night:
    description: 'Convergent near-synonym pair, not homographs, both meaning "good night" as
      a parting farewell: на добраніч / добраніч is a frozen, uninflected interjection (Горох
      tags it вигук, невідмінювана словникова одиниця) and is the far more traditional default;
      доброї ночі is grammatically live -- the same genitive-of-wish construction as доброго
      ранку/дня/вечора (genitive standing in for an implied elided verb, "[бажаю тобі] ...").
      добра ніч (bare nominative) is deliberately NOT a cluster member -- it is not used as a
      greeting at all, just the descriptive phrase "a good night," so there is nothing to test
      productively.

      '
    canonical_note: ua-lexeme-0108
    members:
    - note_id: ua-lexeme-0108
      lemma: На добра́ніч
      status: sourced
      chapter: '1.0'
      comment: Frozen, uninflected interjection -- the traditional default farewell for parting
        at night
      compare_scenario: You're saying goodbye to your host family as you head to bed for the
        night -- what's the standard, most traditional thing to say?
    - note_id: ua-lexeme-0608
      lemma: Доброї но́чі
      status: sourced
      chapter: '1.0'
      comment: Genitive-of-wish alternate, same construction as доброго ранку/дня/вечора --
        grammatically live, less traditional than добраніч
      compare_scenario: You want to wish someone a good night using the same construction as
        "доброго ранку" -- what's the genitive form of ніч?
  fire-general-vs-blaze-vs-campfire:
    description: 'Convergent near-synonym TRIPLET (not homographs) on "fire": пожежа is
      specifically a destructive, uncontrolled fire -- a blaze or conflagration, the kind
      firefighters put out; вого́нь is the broad, general/elemental word for fire itself (a
      flame, a campfire''s light, bodily heat, gunfire) -- the umbrella term, not implying
      harm or intent; ва́тра is specifically a campfire/bonfire (Горох defines it as вогнище),
      a controlled, intentional fire built for warmth, light, or gathering.

      '
    show_all_members: true
    canonical_note: ua-lexeme-0173
    members:
    - note_id: ua-lexeme-0173
      lemma: поже́жа
      status: sourced
      chapter: '2.9.2'
      comment: A destructive, uncontrolled fire -- a blaze or conflagration, the kind firefighters
        put out
      compare_scenario: A building is burning out of control and firefighters are rushing to
        put it out -- what word describes this fire?
    - note_id: ua-lexeme-0329
      lemma: вого́нь
      status: sourced
      chapter: '2.9.7'
      comment: The broad, general/elemental word for fire itself -- a flame, gunfire, bodily
        heat, not implying harm or intent
      compare_scenario: You want the plain, general word for "fire" -- not a disaster, not a
        specific campfire, just fire itself. What word do you use?
    - note_id: ua-lexeme-0610
      lemma: ва́тра
      status: sourced
      chapter: '2.9.2'
      comment: A campfire/bonfire -- a controlled, intentional fire built for warmth, light,
        or gathering
      compare_scenario: You're camping with friends and someone lights a fire on purpose so
        everyone can sit around it and tell stories. What word describes that fire?
  container-nouns-packet-vs-pack:
    description: 'Two container nouns both loosely glossable as "pack" in English:
      паке́т (masc.) is a wrapped or bagged single unit -- a packet, or colloquially
      a plastic bag; па́чка (fem.) is a compact bundle or carton -- e.g. a pack of
      cigarettes, a carton of milk or butter. Different container shapes, not
      interchangeable. Craig-requested 2026-08-28 while both were being drafted in
      ch.3.1 (quantities/containers).

      '
    canonical_note: ua-lexeme-1161
    members:
    - note_id: ua-lexeme-1161
      lemma: паке́т
      status: sourced
      chapter: '2.3.1'
      comment: A wrapped/bagged single unit -- a packet, or colloquially a plastic bag
      compare_scenario: You're at the store and need something to carry loose
        groceries home in, or you're asking for a packet of sugar -- which word
        for "pack" fits?
    - note_id: ua-lexeme-1162
      lemma: па́чка
      status: sourced
      chapter: '2.3.1'
      comment: A compact bundle or carton -- e.g. a pack of cigarettes, a carton of
        milk or butter
      compare_scenario: You're buying a carton of butter or a pack of cigarettes at
        the store -- which word for "pack" fits?
  law-right-vs-statute:
    description: 'Convergent near-synonym PAIR both glossable as "law" in English:
      пра́во (neut.) is law in the abstract/systemic sense -- the legal system,
      jurisprudence, or an entitlement (a right, e.g. пра́во на осві́ту "the right to
      education"; вивча́ти пра́во "to study law" as a discipline); зако́н (masc.) is a
      specific enacted statute -- a law passed by a legislature (ухвали́ти зако́н "to
      pass a law", поруши́ти зако́н "to break the law"). Craig flagged this pair
      2026-08-28 while ch.10.5 civics vocabulary (пра́во) was being drafted alongside
      the pre-existing зако́н note.

      '
    canonical_note: ua-lexeme-0708
    members:
    - note_id: ua-lexeme-0708
      lemma: пра́во
      status: sourced
      chapter: '2.10.5'
      comment: Law in the abstract/systemic sense, or an entitlement/right -- not a
        specific statute
      compare_scenario: You want to say everyone has the right to education, or that
        your friend is studying law at university -- which word for "law/right" fits?
    - note_id: ua-lexeme-0473
      lemma: зако́н
      status: sourced
      chapter: '2.8.3'
      comment: A specific enacted statute -- a law passed by a legislature, that can
        be broken or passed
      compare_scenario: Parliament just passed a new law, or someone got arrested for
        breaking one -- which word for "law" fits here?
