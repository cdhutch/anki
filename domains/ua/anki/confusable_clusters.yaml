        a long walk.
      compare_a: підходити
      compare_b: доходити
      compare_c: ''
      compare_d: ''
      homograph_sense_a: ''
      homograph_sense_b: ''
    - note_id: ua-lexeme-0115
      lemma: вхо́дити
      status: sourced
      chapter: 2.9
      comment: 'в + ходити: enter/go inside (cross threshold)'
      compare_scenario: Someone walks into a building through the front door, on foot.
      compare_a: входити
      compare_b: виходити
      compare_c: ''
      compare_d: ''
      homograph_sense_a: ''
      homograph_sense_b: ''
